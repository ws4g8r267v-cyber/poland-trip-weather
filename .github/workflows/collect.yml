name: collect
# poland-trip-weather · v0.2.2
# ריצה כל 3 שעות + הפעלה ידנית מלשונית Actions (וגם מה-NAS כל שעה).
# v0.2: אחרי האיסוף - כרטיס בוקר כתמונה (render_cards.py) להיום ולמחר
#       בימי הטיול בלבד. בהפעלה ידנית אפשר לבחור all = כל 7 הימים לבדיקה.
#       כשל ברינדור לא עוצר את שמירת הנתונים.
# v0.2.1: גופנים שהועלו לשורש הריפו עוברים לבד ל-fonts/ (פעם אחת).
# v0.2.2: שמירה עמידה. ריצה שהתעכבה (cron) נבנית על הקומיט שהיה בזמן ההפעלה,
#         ואם בינתיים ריצה אחרת או העלאה ידנית דחפו ל-main - ה-push נדחה (06/10 01:53Z).
#         עכשיו: לוקחים את main העדכני ושמים עליו רק את הקבצים שהריצה הזו שינתה ב-data/.
#         עד 3 ניסיונות. קבצים אחרים בריפו לא נוגעים.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      cards:
        description: "כרטיסים: auto = היום ומחר בימי הטיול · all = כל 7 הימים"
        required: false
        default: auto
        type: choice
        options: [auto, all]

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: collect
        run: python collect.py
      - name: tidy fonts
        run: |
          if ls rubik-*.woff2 >/dev/null 2>&1; then
            mkdir -p fonts
            git mv -k rubik-*.woff2 fonts/
            if [ -f OFL-LICENSE.txt ]; then git mv -k OFL-LICENSE.txt fonts/; fi
            echo "moved fonts to fonts/"; ls fonts
          else
            echo "fonts in place"
          fi
      - name: cards
        continue-on-error: true
        env:
          CARDS: ${{ github.event.inputs.cards || 'auto' }}
        run: |
          python - <<'EOF'
          import datetime as dt, os, sys
          from zoneinfo import ZoneInfo
          d = dt.datetime.now(ZoneInfo("Europe/Warsaw")).date()
          need = os.environ["CARDS"] == "all" or any(
              (d + dt.timedelta(days=a)).timetuple()[:2] == (2026, 11)
              and 18 <= (d + dt.timedelta(days=a)).day <= 24
              for a in (0, 1))
          open(os.environ["GITHUB_ENV"], "a").write(
              "NEED_CARDS=%d\n" % need)
          print("need cards:", need)
          EOF
          if [ "$(grep -c NEED_CARDS=1 "$GITHUB_ENV")" = "0" ]; then
            echo "outside the trip - no cards"; exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null
          pip install -q playwright
          python render_cards.py "$CARDS"
      - name: commit data
        run: |
          git config user.name  "trip-weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          CHG=$(git diff --cached --name-only --diff-filter=AM -- data/)
          SAVE="$RUNNER_TEMP/newdata.tar"
          tar -cf "$SAVE" $CHG
          echo "changed by this run:"; echo "$CHG"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            tar -xf "$SAVE"
            git add $CHG
            if git diff --cached --quiet; then
              echo "no change vs main"; exit 0
            fi
            git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin HEAD:main; then
              echo "pushed (try $i)"; exit 0
            fi
            echo "push rejected (try $i) - retry"; sleep $((i*5))
          done
          echo "push failed 3 times"; exit 1
