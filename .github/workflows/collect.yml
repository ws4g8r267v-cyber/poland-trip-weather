name: collect
# poland-trip-weather · v0.1
# ריצה כל 3 שעות + הפעלה ידנית מלשונית Actions. התזמון של GitHub לא מובטח לדקה.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: collect
        run: python collect.py
      - name: commit data
        run: |
          git config user.name  "trip-weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
